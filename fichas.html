<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cairn - Gerador de Fichas</title>
<style>
  :root { --w: 72mm; --fs: 11px; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #eee; color: #111; }
  .panel { background: #fff; padding: 12px 16px; border-bottom: 1px solid #ccc; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; position: sticky; top: 0; z-index: 5; }
  .panel h1 { font-size: 18px; margin: 0 16px 0 0; width: 100%; }
  .panel label { font-size: 12px; display: flex; flex-direction: column; gap: 3px; }
  .panel select, .panel input { font-size: 14px; padding: 5px; }
  .panel input[type=number] { width: 70px; }
  button { font-size: 14px; padding: 7px 14px; cursor: pointer; border: 1px solid #333; background: #fff; border-radius: 4px; }
  button.primary { background: #222; color: #fff; }
  .hint { font-size: 12px; color: #555; padding: 8px 16px; }
  .warn { color: #a00; }
  #sheets { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; align-items: flex-start; }
  .wrap { display: flex; flex-direction: column; gap: 6px; }
  .tools { display: flex; flex-wrap: wrap; gap: 4px; max-width: var(--w); }
  .tools button { font-size: 11px; padding: 3px 7px; }

  /* ===== Ficha (formato cupom) ===== */
  .sheet { width: var(--w); background: #fff; color: #000; font-family: "Courier New", Courier, monospace; font-size: var(--fs); line-height: 1.25; padding: 3mm 2mm; box-shadow: 0 1px 4px rgba(0,0,0,.3); font-weight: bold; }
  .sheet h2 { font-size: calc(var(--fs) + 4px); text-align: center; margin: 0 0 2px; letter-spacing: 1px; }
  .sheet .sub { text-align: center; font-weight: normal; }
  .sheet .hr { border-top: 2px dashed #000; margin: 5px 0; }
  .sheet .hr.solid { border-top: 2px solid #000; }
  .sheet .sec { text-align: center; letter-spacing: 1px; margin: 2px 0 3px; }
  .sheet .name { font-size: calc(var(--fs) + 3px); text-align: center; word-break: break-word; }
  .sheet .row { display: flex; justify-content: space-between; gap: 4px; }
  .sheet .lbl { font-weight: normal; }
  .sheet .attrs { display: flex; gap: 3px; }
  .sheet .attr { flex: 1; border: 2px solid #000; text-align: center; padding: 2px 0; }
  .sheet .attr .n { font-size: calc(var(--fs) + 3px); line-height: 1.4; white-space: nowrap; }
  .sheet .attr .cur { font-weight: normal; font-size: calc(var(--fs) - 2px); border-top: 1px solid #000; margin-top: 2px; }
  .sheet .pg { display: flex; gap: 3px; margin-top: 4px; }
  .sheet .pg > div { flex: 1; border: 2px solid #000; text-align: center; padding: 2px 0; }
  .sheet .pg .n { font-size: calc(var(--fs) + 9px); line-height: 1.1; }
  .sheet .trait { display: flex; justify-content: space-between; gap: 4px; }
  .sheet .trait span:first-child { font-weight: normal; }
  .sheet .slot { display: flex; gap: 4px; align-items: baseline; padding: 1px 0; border-bottom: 1px dotted #000; }
  .sheet .slot .z { font-weight: normal; width: 9ch; flex: none; font-size: calc(var(--fs) - 1px); }
  .sheet .slot .t { flex: 1; word-break: break-word; }
  .sheet .slot.empty .t { color: transparent; }
  .sheet .slot .bx { flex: none; }
  .sheet .spell { margin: 3px 0; }
  .sheet .spell .d { font-weight: normal; }
  .sheet .lines div { border-bottom: 1px solid #000; height: 5mm; }
  .sheet .center { text-align: center; }
  .sheet .small { font-weight: normal; font-size: calc(var(--fs) - 1px); }

  @media print {
    body { background: #fff; }
    .panel, .hint, .tools { display: none !important; }
    #sheets { display: block; padding: 0; }
    .wrap { display: block; }
    .sheet { box-shadow: none; page-break-after: always; break-after: page; }
    .wrap:last-child .sheet { page-break-after: auto; break-after: auto; }
  }
</style>
<style id="pagestyle">@page { size: 80mm auto; margin: 0; }</style>
<link rel="stylesheet" href="cairn.css"><style>body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:16px}
.panel{background:var(--panel);border-bottom:2px solid var(--rule)}
.panel h1{font-family:var(--font-display);font-weight:700;font-size:28px}
.panel select,.panel input{background:var(--paper);color:var(--ink);border:1px solid var(--rule);font-family:var(--font-ui)}
button{font-family:var(--font-ui);background:var(--panel);color:var(--ink);border:1px solid var(--ink)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hint{color:var(--ink);opacity:.75}.warn{color:#b3261e}</style></head>
<body>

<div class="panel">
  <h1>Cairn · Gerador de Fichas (cupom)</h1>
  <label>Papel
    <select id="paper">
      <option value="80">80 mm (área ~72 mm)</option>
      <option value="58">58 mm (área ~48 mm)</option>
    </select>
  </label>
  <label>Nomes
    <select id="nameset">
      <option value="gp">Galego-português</option>
      <option value="en">Padrão (Cairn)</option>
    </select>
  </label>
  <label>Gênero do nome
    <select id="gender">
      <option value="r">Aleatório</option>
      <option value="f">Feminino</option>
      <option value="m">Masculino</option>
    </select>
  </label>
  <label>Quantidade
    <input type="number" id="qty" min="1" max="20" value="1">
  </label>
  <button class="primary" id="gen">🎲 Gerar</button>
  <button id="print">🖨️ Imprimir</button>
  <button id="png">🖼️ Exportar PNG</button>
</div>
<div class="hint">
  Dica: na janela de impressão escolha a impressora térmica, margens “Nenhuma” e desmarque cabeçalhos/rodapés. Use os botões acima de cada ficha para trocar dois atributos (regra do jogo) ou rolar de novo só aquela ficha.
  <span id="alert" class="warn"></span>
</div>
<div id="sheets"></div>

<script>

// [maxRolagem, valor]
const ARM_VAL = { "Couro": 1, "Cota de malha": 2, "Placas": 3 };
const ARMADURA = [[3,null],[14,"Couro"],[19,"Cota de malha"],[20,"Placas"]];
const ELMO_ESC = [[13,[]],[16,["Elmo"]],[19,["Escudo"]],[20,["Elmo","Escudo"]]];
const ARMAS = [

  [14,["Espada","Maça","Machado"]],
  [19,["Arco","Besta","Funda"]],
  [20,["Alabarda","Martelo de guerra","Machado de batalha","Espada grande"]]
];
const PESADAS = ["Alabarda","Martelo de guerra","Machado de batalha","Espada grande"];
// d20 1..17 conhecidos; 18-20 ilegíveis no original -> rolar de novo
const EXPEDICAO = ["Veneno","Algemas","Amuleto de proteção","Antitoxina","Armadilha grande","Óleo inflamável","Sedativo","Bastão (3 m)","Carrinho (volumoso)","Corda (12 m)","Bandagens (3 usos)","Luneta","Picareta","Gancho","Tocha","Saco grande","Lanterna"];
const FERRAMENTAS = ["Ampulheta","Jogo de chá","Broca manual","Cola","Cinzel","Óleo inflamável","Giz","Graxa","Lixa de metal","Martelo","Pá","Panelas","Pé de cabra","Pinças","Pinos","Pregos","Rede","Selante","Serra","Vara de pesca"];
const BUGIGANGAS = ["Apito","Baralho","Barbante","Bola de gude","Corneta","Dados","Espelho","Esponja","Garrafa","Incenso","Instrumento musical","Joias falsas","Lente","Pena e tinta","Perfume","Piche","Sabão","Sal","Sineta","Tinta"];

// Magias (100) - nome|descrição
const MAGIAS_RAW = `Acelerar|Sua velocidade de movimento é triplicada.
Aderir|Um objeto é coberto em uma gosma extremamente pegajosa.
Adormecer|Uma criatura que você pode ver cai em um sono leve.

const MAGIAS = MAGIAS_RAW.split("\n").map(l => { const i = l.indexOf("|"); return { n: l.slice(0,i), d: l.slice(i+1) }; });

/* ================= DADOS (rolagens) ================= */
const d = n => 1 + Math.floor(Math.random() * n);
const nd = (c, n) => { let s = 0; for (let i = 0; i < c; i++) s += d(n); return s; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const byRange = (roll, table) => table.find(([max]) => roll <= max)[1];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

/* ================= GERAÇÃO ================= */
function rollNome(set, gender) {
  const g = gender === "r" ? (d(2) === 1 ? "f" : "m") : gender;
  if (set === "en") {
    return pick(g === "f" ? NOMES_F : NOMES_M) + " " + pick(SOBRENOMES);
  }
  const nome = pick(g === "f" ? GP_F : GP_M);
  // sobrenome: rola duas vezes; "—" = sem sobrenome
  let s = [pick(GP_S), pick(GP_S)].filter(Boolean);
  // se ambos contêm "de", remove o "de" de um deles
  if (s.length === 2 && s.every(x => /^de\s|^d'/.test(x))) s[1] = s[1].replace(/^de\s+|^d'/, "");
  return [nome, ...s].join(" ");
}

function rollArmadura(allowNone) {
  let a; do { a = byRange(d(20), ARMADURA); } while (!allowNone && !a);
  return a;
}
function rollExpedicao() {
  let r; do { r = d(20); } while (r > EXPEDICAO.length); // 18-20 ilegíveis -> repete
  return EXPEDICAO[r - 1];
}

function rollPersonagem(opts) {
  const c = {};
  c.nome = rollNome(opts.nameset, opts.gender);
  c.antecedente = pick(ANTECEDENTES);
  c.tracos = TRACOS.map(([k, v]) => [k, pick(v)]);
  c.idade = nd(2, 20) + 10;
  c.attrs = { FOR: nd(3, 6), DES: nd(3, 6), VON: nd(3, 6) };
  c.pg = d(6);
  c.prata = nd(3, 6);

  // itens: {t, big, slotPref}
  const itens = [];
  const arma = pick(byRange(d(20), ARMAS));
  const pesada = PESADAS.includes(arma);
  itens.push({ t: arma + (pesada ? " (volumosa)" : ""), big: pesada, pref: [0, 1] });
  const ee = byRange(d(20), ELMO_ESC);
  const arm = rollArmadura(true);
  if (arm) itens.push({ t: arm, pref: [3], arm: ARM_VAL[arm] });
  if (ee.includes("Escudo")) itens.push({ t: "Escudo", pref: [1], esc: true });
  if (ee.includes("Elmo")) itens.push({ t: "Elmo", pref: [2], elmo: true });
  itens.push({ t: "Rações (3 dias)" });
  itens.push({ t: "Tocha" });
  const exp = rollExpedicao();
  itens.push({ t: exp, big: /volumoso/.test(exp) });
  itens.push({ t: pick(FERRAMENTAS) });
  itens.push({ t: pick(BUGIGANGAS) });

  // item bônus
  c.livros = [];
  const b = d(20);
  if (b <= 5) itens.push({ t: d(2) === 1 ? pick(FERRAMENTAS) : pick(BUGIGANGAS), bonus: true });
  else if (b <= 12) { const e = rollExpedicao(); itens.push({ t: e, big: /volumoso/.test(e), bonus: true }); }
  else if (b <= 15) {
    if (d(2) === 1) { const a = pick(byRange(d(20), ARMAS)); const p = PESADAS.includes(a); itens.push({ t: a + (p ? " (volumosa)" : ""), big: p, bonus: true }); }
    else { const ab = rollArmadura(false); itens.push({ t: ab, arm: ARM_VAL[ab], bonus: true }); }
  } else {
    const m = pick(MAGIAS);
    c.livros.push(m);
    itens.push({ t: "Livro: " + m.n, bonus: true });
  }
  c.itens = itens;
  c.armadura = Math.max(0, ...itens.map(i => i.arm || 0)) + (itens.some(i => i.elmo) ? 1 : 0) + (itens.some(i => i.esc) ? 1 : 0);
  c.bonusRoll = b;
  return c;
}

/* ================= INVENTÁRIO ================= */
const ZONAS = ["Mão D.", "Mão E.", "Corpo", "Corpo", "Mochila", "Mochila", "Mochila", "Mochila", "Mochila", "Mochila"];
function montarInventario(itens) {
  const slots = ZONAS.map(z => ({ z, t: "", cont: false }));
  const excesso = [];
  const livre = i => slots[i] && !slots[i].t && !slots[i].cont;
  const place = it => {
    const need = it.big ? 2 : 1;
    let idx = [];
    if (it.pref && it.pref.slice(0, need).every(livre) && it.pref.length >= need) idx = it.pref.slice(0, need);
    else if (!it.big && it.pref && livre(it.pref[0])) idx = [it.pref[0]];
    if (idx.length < need) {
      idx = [];
      for (let i = 0; i < 10 && idx.length < need; i++) if (livre(i)) idx.push(i);
    }
    if (idx.length < need) { excesso.push(it.t); return; }
    slots[idx[0]].t = it.t;
    if (need === 2) { slots[idx[1]].cont = true; slots[idx[1]].t = "↳ (ocupa 2 espaços)"; }
  };
  itens.forEach(place);
  const usados = slots.filter(s => s.t).length;
  return { slots, excesso, usados };
}

/* ================= RENDER ================= */
let state = [];

function sheetHTML(c, i) {
  const inv = montarInventario(c.itens);
  const slotsHTML = inv.slots.map((s, k) =>
    `<div class="slot ${s.t ? "" : "empty"}"><span class="t">${esc(s.t || ".")}</span><span class="bx">${s.cont ? "" : "[ ]"}</span></div>`
  ).join("");
  const exc = inv.excesso.length
    ? `<div class="small">!! EXCEDE O INVENTÁRIO:<br>${inv.excesso.map(esc).join(", ")}</div>` : "";
  const cheio = inv.usados >= 10
    ? `<div class="center">** INVENTÁRIO CHEIO: 0 PG **</div>` : "";
  const tracos = c.tracos.map(([k, v]) => `<div class="trait"><span>${k}</span><span>${esc(v)}</span></div>`).join("");
  const spells = c.livros.map(m => `<div class="spell">▸ ${esc(m.n.toUpperCase())}<div class="d">${esc(m.d)}</div></div>`).join("");

  return `<div class="wrap" data-i="${i}">
    <div class="tools">
      <button onclick="swap(${i},'FOR','DES')">FOR↔DES</button>
      <button onclick="swap(${i},'FOR','VON')">FOR↔VON</button>
      <button onclick="swap(${i},'DES','VON')">DES↔VON</button>
      <button onclick="reroll(${i})">🎲 Refazer</button>
    </div>
    <div class="sheet">
      <h2>★ CAIRN ★</h2>
      <div class="sub">Ficha de Personagem</div>
      <div class="hr solid"></div>
      <div class="name">${esc(c.nome)}</div>
      <div class="center">${esc(c.antecedente)} · ${c.idade} anos</div>
      <div class="hr"></div>
      <div class="attrs">
        ${["FOR","DES","VON"].map(a => `<div class="attr"><div>${a}</div><div class="n">__/${c.attrs[a]}</div></div>`).join("")}
      </div>
      <div class="pg">
        <div><div>PG</div><div class="n">${c.pg}</div><div class="small">atual: ____</div></div>
        <div><div>ARMADURA</div><div class="n">${c.armadura}</div><div class="small">&nbsp;</div></div>
      </div>
      <div class="hr"></div>
      <div class="sec">— TRAÇOS —</div>
      ${tracos}
      <div class="hr"></div>
      <div class="sec">— INVENTÁRIO —</div>
      ${slotsHTML}
      ${exc}${cheio}
      <div style="height:8mm"></div>
      ${spells ? `<div class="hr"></div><div class="sec">— FEITIÇOS —</div>${spells}` : ""}
      <div class="hr solid"></div>
      <div style="height:6mm"></div>
    </div>
  </div>`;
}

function render() {
  document.getElementById("sheets").innerHTML = state.map(sheetHTML).join("");
  const warn = state.some(c => montarInventario(c.itens).usados >= 10);
  document.getElementById("alert").textContent = warn
    ? " ⚠ Há ficha com inventário cheio (10/10): regra do livro reduz os PG a 0." : "";
}

function opts() {
  return { nameset: document.getElementById("nameset").value, gender: document.getElementById("gender").value };
}
function gerar() {
  const n = Math.max(1, Math.min(20, parseInt(document.getElementById("qty").value) || 1));
  state = Array.from({ length: n }, () => rollPersonagem(opts()));
  render();
}
function swap(i, a, b) { const t = state[i].attrs[a]; state[i].attrs[a] = state[i].attrs[b]; state[i].attrs[b] = t; render(); }
function reroll(i) { state[i] = rollPersonagem(opts()); render(); }

function setPaper() {
  const p = document.getElementById("paper").value;
  const root = document.documentElement.style;
  if (p === "58") { root.setProperty("--w", "48mm"); root.setProperty("--fs", "10px"); }
  else { root.setProperty("--w", "72mm"); root.setProperty("--fs", "11px"); }
  document.getElementById("pagestyle").textContent = `@page { size: ${p}mm auto; margin: 0; }`;
}

document.getElementById("gen").onclick = gerar;
document.getElementById("print").onclick = () => window.print();

/* ================= EXPORTAR PNG ================= */
function sheetToPNG(el, filename) {
  return new Promise((resolve, reject) => {
    const css = [...document.querySelectorAll("style")].map(s => s.textContent).join("\n")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;");
    const w = el.offsetWidth, h = el.offsetHeight, scale = 3;
    const root = document.documentElement.style;
    const vars = `--w:${root.getPropertyValue("--w")};--fs:${root.getPropertyValue("--fs")}`;
    const clone = el.cloneNode(true);
    clone.style.boxShadow = "none";
    const xml = new XMLSerializer().serializeToString(clone);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" style="${vars}"><style>${css}</style>${xml}</div></foreignObject></svg>`;
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement("canvas");
      cv.width = w * scale; cv.height = h * scale;
      const ctx = cv.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.scale(scale, scale);
      ctx.drawImage(img, 0, 0);
      cv.toBlob(b => {
        if (!b) return reject(new Error("falha ao gerar PNG"));
        const a = document.createElement("a");
        a.href = URL.createObjectURL(b); a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        resolve();
      }, "image/png");
    };
    img.onerror = () => reject(new Error("falha ao renderizar a ficha"));
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });
}
async function exportarPNG() {
  const els = [...document.querySelectorAll(".sheet")];
  for (let i = 0; i < els.length; i++) {
    const nome = (state[i] ? state[i].nome : "ficha").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-|-$/g, "").toLowerCase();
    try { await sheetToPNG(els[i], `cairn-${nome || "ficha"}.png`); }
    catch (e) { alert("Erro ao exportar PNG: " + e.message); return; }
    await new Promise(r => setTimeout(r, 400));
  }
}
document.getElementById("png").onclick = exportarPNG;

document.getElementById("paper").onchange = setPaper;
setPaper();
gerar();
</script>
